name: Daily Test Run

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: pytest --html=report.html --junitxml=results.xml -v
        continue-on-error: true

      - name: Build history and copy report
        run: python scripts/publish_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Automated test run $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin main
